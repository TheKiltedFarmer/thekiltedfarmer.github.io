<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kilted Farmers Pasta Highlanders</title>
<meta name="description" content="Sell The Kilted Farmers' handmade pasta at your own events and earn a commission.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#2D6A4F;--green-dark:#1B4332;--green-light:#52B788;--green-wash:#e8f3ec;
  --tan:#A67C52;--tan-light:#D4A96A;--tan-wash:#f6ede2;
  --cream:#FAF6EF;--cream-dark:#F0E9DC;
  --ink:#1A1A1A;--mid:#5A5A5A;--rule:#D8CFC4;--red:#C0392B;--red-wash:#fbeceb;--blue:#2471A3;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{background:var(--cream);font-family:'Source Sans 3',system-ui,sans-serif;color:var(--ink);min-height:100vh;font-size:15px;line-height:1.45;}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit;}
a{color:var(--green-dark);}

.header{background:var(--green-dark);padding:22px 16px 18px;text-align:center;position:relative;overflow:hidden;}
.header::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 18px,rgba(255,255,255,.035) 18px,rgba(255,255,255,.035) 36px),repeating-linear-gradient(-45deg,transparent,transparent 18px,rgba(212,169,106,.05) 18px,rgba(212,169,106,.05) 36px);}
.header>*{position:relative;}
.kicker{font-size:11px;letter-spacing:4px;color:var(--tan-light);text-transform:uppercase;font-weight:700;}
.header h1{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;color:#fff;margin-top:4px;line-height:1.15;}
.header .sub{font-size:13px;color:rgba(255,255,255,.62);margin-top:4px;}
.header .rule{width:44px;height:2px;background:var(--tan-light);margin:10px auto 0;}
.who{position:absolute;top:10px;right:10px;z-index:2;}
.who button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;}

.wrap{max-width:640px;margin:0 auto;padding:18px 16px 110px;}
.card{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.04);}
.card h2{font-family:'Playfair Display',serif;font-size:19px;color:var(--green-dark);margin-bottom:4px;line-height:1.2;}
.card h3{font-size:15px;font-weight:700;margin-bottom:2px;}
.muted{color:var(--mid);font-size:13px;}
.small{font-size:12px;}
.center{text-align:center;}
.gap{height:10px;}

label{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mid);font-weight:700;margin:12px 0 5px;}
.inp{width:100%;padding:11px 12px;border:1.5px solid var(--rule);border-radius:9px;background:var(--cream);}
.inp:focus{outline:none;border-color:var(--green);background:#fff;}
textarea.inp{min-height:80px;resize:vertical;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px;cursor:pointer;}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--green);flex-shrink:0;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:10px;border:none;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;}
.btn.full{width:100%;}
.btn.primary{background:var(--green-dark);color:#fff;}
.btn.primary:active{background:var(--green);}
.btn.tan{background:var(--tan);color:#fff;}
.btn.ghost{background:transparent;color:var(--green-dark);border:2px solid var(--green-dark);}
.btn.soft{background:var(--cream-dark);color:var(--green-dark);}
.btn.danger{background:transparent;color:var(--red);border:2px solid var(--red);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:8px;}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.link{background:none;border:none;color:var(--green-dark);text-decoration:underline;cursor:pointer;font-size:14px;padding:0;}

.msg{border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px;}
.msg.err{background:var(--red-wash);color:var(--red);}
.msg.ok{background:var(--green-wash);color:var(--green-dark);}
.msg.info{background:var(--tan-wash);color:#6d4d2c;}
.msg:empty{display:none;}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.stat{background:var(--cream);border-radius:10px;padding:11px 12px;}
.stat .l{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mid);font-weight:700;}
.stat .v{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:var(--green-dark);margin-top:2px;}
.stat .s{font-size:12px;color:var(--mid);}
.meter{height:12px;background:var(--cream-dark);border-radius:8px;overflow:hidden;margin-top:14px;position:relative;}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green-light));border-radius:8px;transition:width .4s;}
.meter.done i{background:linear-gradient(90deg,var(--tan),var(--tan-light));}
.meter-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--mid);margin-top:5px;}

.linkbox{display:flex;gap:8px;align-items:center;background:var(--cream);border:1.5px dashed var(--rule);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px;word-break:break-all;}
.linkbox code{flex:1;font-family:inherit;color:var(--green-dark);font-weight:600;}

.ev{border:1px solid var(--rule);border-radius:12px;padding:14px;margin-top:10px;background:#fff;}
.ev-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.ev-date{flex-shrink:0;width:52px;text-align:center;background:var(--green-wash);border-radius:10px;padding:6px 0;color:var(--green-dark);}
.ev-date b{display:block;font-family:'Playfair Display',serif;font-size:22px;line-height:1;}
.ev-date span{font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:700;}
.ev-main{flex:1;min-width:0;}
.ev-name{font-weight:700;font-size:16px;line-height:1.25;}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px;background:var(--cream-dark);color:var(--mid);white-space:nowrap;}
.chip.green{background:var(--green-wash);color:var(--green-dark);}
.chip.tan{background:var(--tan-wash);color:#7a5530;}
.chip.red{background:var(--red-wash);color:var(--red);}
.chip.blue{background:#e6f0f7;color:var(--blue);}
.lines{margin-top:10px;border-top:1px solid var(--cream-dark);padding-top:8px;font-size:14px;}
.lines div{display:flex;justify-content:space-between;gap:8px;padding:2px 0;}

.section-t{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mid);font-weight:700;margin:20px 2px 2px;}

.prod{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--cream-dark);}
.prod:last-child{border-bottom:none;}
.prod-main{flex:1;min-width:0;}
.prod-name{font-weight:600;}
.prod-sub{font-size:12px;color:var(--mid);}
.step{display:flex;align-items:center;border:1.5px solid var(--rule);border-radius:10px;overflow:hidden;flex-shrink:0;}
.step button{width:38px;height:38px;border:none;background:var(--cream);font-size:20px;font-weight:700;color:var(--green-dark);cursor:pointer;}
.step input{width:46px;height:38px;border:none;text-align:center;font-weight:700;background:#fff;-moz-appearance:textfield;}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.line-h{font-size:12px;font-weight:700;color:var(--tan);text-transform:uppercase;letter-spacing:1px;margin-top:14px;}

.total-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--green-dark);color:#fff;border-radius:12px;padding:12px 14px;margin-top:14px;}
.total-bar .big{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;}
.total-bar .s{font-size:12px;color:rgba(255,255,255,.7);}

.order{border-bottom:1px solid var(--cream-dark);padding:12px 0;}
.order:last-child{border-bottom:none;}
.order-top{display:flex;justify-content:space-between;gap:10px;}

table.st{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px;}
table.st th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--mid);text-align:right;padding:6px 4px;border-bottom:1px solid var(--rule);font-weight:700;}
table.st th:first-child,table.st td:first-child{text-align:left;}
table.st td{padding:8px 4px;border-bottom:1px solid var(--cream-dark);text-align:right;vertical-align:top;}
table.st tfoot td{font-weight:700;border-bottom:none;border-top:2px solid var(--rule);}

.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--rule);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:50;box-shadow:0 -4px 16px rgba(0,0,0,.05);}
.nav-in{display:flex;max-width:640px;width:100%;}
.nav button{flex:1;background:none;border:none;padding:9px 4px 10px;font-size:12px;font-weight:700;color:var(--mid);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.nav button.on{color:var(--green-dark);}
.nav button.on::before{content:'';position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--tan);border-radius:0 0 3px 3px;}
.dot{position:absolute;top:5px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;line-height:17px;padding:0 4px;}

.pick{display:block;border:2px solid var(--rule);border-radius:12px;padding:12px 14px;margin-top:10px;cursor:pointer;background:#fff;}
.pick input{display:none;}
label.pick,label.check{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:400;}
.pick.on{border-color:var(--green);background:var(--green-wash);}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.chips button{border:1.5px solid var(--rule);background:#fff;border-radius:18px;padding:6px 12px;font-size:14px;font-weight:700;color:var(--green-dark);cursor:pointer;}
.chips button.on{background:var(--green-dark);border-color:var(--green-dark);color:#fff;}
.goal-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
.goal-row .dollar{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;color:var(--tan);}
.goal-row input{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;color:var(--green-dark);width:150px;padding:6px 10px;}
.seg2{display:flex;background:var(--cream-dark);padding:3px;border-radius:9px;margin-top:12px;}
.seg2 button{flex:1;padding:8px 6px;border:none;background:transparent;border-radius:7px;font-weight:700;font-size:13px;color:var(--mid);cursor:pointer;}
.seg2 button.on{background:#fff;color:var(--green-dark);box-shadow:0 1px 4px rgba(0,0,0,.08);}
.calc-out{background:var(--green-wash);border-radius:12px;padding:14px;margin-top:12px;}
.calc-big{font-family:'Playfair Display',serif;font-size:30px;font-weight:900;color:var(--green-dark);line-height:1.1;}
.calc-rows{margin-top:10px;border-top:1px solid rgba(27,67,50,.15);padding-top:8px;font-size:14px;}
.calc-rows div{display:flex;justify-content:space-between;gap:8px;padding:3px 0;}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--green-dark);color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:100;max-width:90vw;text-align:center;}
.toast.err{background:var(--red);}
.toast.show{opacity:1;}
.loading{text-align:center;color:var(--mid);padding:40px 0;}
.kv{margin-top:8px;font-size:14px;display:grid;gap:3px;}
.kv div{display:flex;gap:8px;}
.kv span{color:var(--mid);min-width:86px;flex-shrink:0;}
.kv a{color:var(--green-dark);font-weight:600;word-break:break-word;}
.est{background:var(--green-wash);border-radius:12px;padding:12px 14px;margin-top:10px;color:var(--green-dark);}
.est b{font-family:'Playfair Display',serif;font-size:22px;}
.ev-date.rec{background:var(--tan-wash);color:#7a5530;}
.ev-date.rec b{font-size:18px;}
details.more{margin-top:12px;border-top:1px solid var(--cream-dark);padding-top:6px;}
details.more summary{cursor:pointer;font-weight:700;color:var(--green-dark);padding:6px 0;font-size:14px;}
.empty{text-align:center;color:var(--mid);padding:18px 6px;font-size:14px;}
.hero-ico{font-size:40px;text-align:center;margin-bottom:6px;}
ul.plain{list-style:none;margin-top:8px;}
ul.plain li{padding:6px 0 6px 26px;position:relative;font-size:14px;}
ul.plain li::before{content:'✓';position:absolute;left:4px;color:var(--green);font-weight:700;}
@media(max-width:380px){.row2{grid-template-columns:1fr;}.header h1{font-size:22px;}}
</style>
</head>
<body>
<div class="header">
  <div class="who" id="who"></div>
  <div class="kicker">The Kilted Farmers</div>
  <h1 id="hTitle">Pasta Highlanders</h1>
  <div class="sub" id="hSub">Handmade pasta, sold by neighbors</div>
  <div class="rule"></div>
</div>
<div class="wrap" id="app"><div class="loading">Loading…</div></div>
<nav class="nav" id="nav" style="display:none;"></nav>
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════
// THE KILTED FARMERS — PASTA HIGHLANDERS
// Highlanders sign in here. ?r=CODE opens a Highlander's public order page.
// ═══════════════════════════════════════════════════════
const SUPABASE_URL='https://zhnilrohxoixsgmdyqiw.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpobmlscm9oeG9peHNnbWR5cWl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyNzQ5MzIsImV4cCI6MjA4OTg1MDkzMn0._75UyJVi0CPIqDom253zhNQ7-Eqe6e1-FKTLt2NSFcE';
const AUTH_KEY='kf_rep_auth';
const KITCHEN='The Kilted Farmers kitchen in Concord';

const S={auth:null,user:null,rep:null,cfg:null,products:[],events:[],preorders:[],view:'home',month:null,draft:null,count:null};

// ─── helpers ───
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function r2(n){return Math.round((parseFloat(n)||0)*100)/100;}
function fmt(n){return '$'+r2(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmt0(n){const v=r2(n);return '$'+(v%1?v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):v.toLocaleString('en-US'));}
function isoLocal(d){d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return isoLocal(new Date());}
function parseISO(s){const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3],12):null;}
function ym(s){return String(s||'').slice(0,7);}
function monthName(k){const d=parseISO(k+'-01');return d?d.toLocaleDateString('en-US',{month:'long',year:'numeric'}):k;}
function dayLabel(s){const d=parseISO(s);return d?d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}):'';}
function toast(m,err){const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(err?' err':'');clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast'+(err?' err':''),3200);}
function $(id){return document.getElementById(id);}
function plural(n,w){return n+' '+w+(n===1?'':'s');}
function lineName(k){return (S.cfg&&S.cfg.line_names&&S.cfg.line_names[k])||k;}
function priceFor(line,zone){const c=S.cfg||{};return r2((+((c.prices||{})[line])||0)+(zone==='far'?(+c.far_add||0):0));}
function copy(t,msg){const done=()=>toast(msg||'Copied');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done));else fallbackCopy(t,done);}
function fallbackCopy(t,done){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done();}catch(e){prompt('Copy this:',t);}a.remove();}

// ─── auth & data ───
function saveAuth(a){S.auth=a;try{if(a)localStorage.setItem(AUTH_KEY,JSON.stringify({refresh_token:a.refresh_token}));else localStorage.removeItem(AUTH_KEY);}catch(e){}}
async function authFetch(path,body,method){
  const res=await fetch(SUPABASE_URL+'/auth/v1/'+path,{method:method||'POST',headers:Object.assign({'apikey':SUPABASE_KEY,'Content-Type':'application/json'},S.auth&&method?{'Authorization':'Bearer '+S.auth.access_token}:{}),body:body?JSON.stringify(body):undefined});
  let data={};try{data=await res.json();}catch(e){}
  if(!res.ok)throw new Error(friendlyAuth(data.error_description||data.msg||data.message||data.error||'Something went wrong'));
  return data;
}
function friendlyAuth(m){
  if(/invalid login/i.test(m))return 'That email and password don’t match. Try again, or reset your password.';
  if(/not confirmed/i.test(m))return 'Your email isn’t confirmed yet. Click the link in the email we sent, then sign in.';
  if(/already registered|already exists/i.test(m))return 'There’s already an account with that email. Sign in instead.';
  if(/rate limit|too many/i.test(m))return 'Too many tries. Wait a few minutes and try again.';
  return m;
}
let _refreshing=null;
async function refresh(){
  if(_refreshing)return _refreshing;
  _refreshing=(async()=>{
    let rt=S.auth&&S.auth.refresh_token;
    if(!rt){try{rt=(JSON.parse(localStorage.getItem(AUTH_KEY)||'{}')).refresh_token;}catch(e){}}
    if(!rt)return false;
    try{const d=await authFetch('token?grant_type=refresh_token',{refresh_token:rt});saveAuth(d);S.user=d.user||S.user;return true;}
    catch(e){saveAuth(null);return false;}
  })();
  const r=await _refreshing;_refreshing=null;return r;
}
async function api(path,opts={},retried){
  const headers=Object.assign({'apikey':SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'},opts.headers||{});
  if(S.auth)headers['Authorization']='Bearer '+S.auth.access_token;
  const res=await fetch(SUPABASE_URL+'/rest/v1/'+path,Object.assign({},opts,{headers}));
  if(res.status===401&&S.auth&&!retried&&await refresh())return api(path,opts,true);
  if(res.status===204)return null;
  let data=null;try{data=await res.json();}catch(e){}
  if(!res.ok)throw new Error((data&&(data.message||data.hint||data.error))||res.statusText||'Something went wrong');
  return data;
}
function rpc(name,args){return api('rpc/'+name,{method:'POST',body:JSON.stringify(args||{})});}

// ─── start ───
async function init(){
  const q=new URLSearchParams(location.search);
  const code=q.get('r');
  if(code){renderOrderPage(code);return;}
  // Links from emails (confirm account, reset password) arrive with tokens in the hash
  const h=new URLSearchParams(location.hash.replace(/^#/,''));
  if(h.get('access_token')){
    saveAuth({access_token:h.get('access_token'),refresh_token:h.get('refresh_token')});
    const type=h.get('type');
    history.replaceState(null,'',location.pathname+location.search);
    if(type==='recovery'){renderAuth('reset');return;}
  }else if(h.get('error_description')){
    history.replaceState(null,'',location.pathname+location.search);
    renderAuth('signin',decodeURIComponent(h.get('error_description').replace(/\+/g,' ')));return;
  }
  if(S.auth||await refresh()){await boot();return;}
  renderAuth('signin');
}

async function boot(){
  $('app').innerHTML='<div class="loading">Loading your Highlander account…</div>';
  try{
    const u=await authFetch('user',null,'GET');S.user=u;
  }catch(e){if(!(await refresh())){saveAuth(null);renderAuth('signin');return;}try{S.user=await authFetch('user',null,'GET');}catch(x){saveAuth(null);renderAuth('signin');return;}}
  try{
    const rows=await api('kf_reps?user_id=eq.'+S.user.id+'&select=*');
    S.rep=(rows&&rows[0])||null;
    S.cfg=await rpc('kf_rep_cfg');
  }catch(e){$('app').innerHTML='<div class="card"><h2>Couldn’t load</h2><p class="muted">'+esc(e.message)+'</p><div class="btns"><button class="btn primary" onclick="boot()">Try again</button></div></div>';return;}
  setWho();
  if(!S.rep||S.rep.status==='declined'){renderApply();return;}
  if(S.rep.status==='pending'){renderPending();return;}
  if(S.rep.status==='paused'){renderPaused();return;}
  await loadAll();
  go(S.view||'home');
}
async function loadAll(){
  const [p,e,o]=await Promise.all([
    api('kf_rep_products?active=eq.true&order=sort_order.asc,line.asc,name.asc'),
    api('kf_rep_events?select=*,kf_rep_event_lines(*)&order=event_date.desc,created_at.desc'),
    api('kf_rep_preorders?order=created_at.desc')

async function doAuth(mode){

  }catch(e){msg.className='msg err';msg.textContent=e.message;}
  finally{if(btn.isConnected){btn.disabled=false;btn.textContent=label;}}
}

// ─── commission math (same rule the database uses) ───
function cfgRates(){const c=S.cfg||{};return{base:(+c.base_rate||25)/100,top:(+c.top_rate||30)/100,th:+c.threshold||0};}
function addCommission(prior,add){const r=cfgRates();const below=Math.max(0,Math.min(add,r.th-prior));return r2(below*r.base+(add-below)*r.top);}
function monthSummary(k){
  const ev=S.events.filter(e=>e.status==='settled'&&ym(e.event_date)===k).sort((a,b)=>a.event_date.localeCompare(b.event_date)||String(a.settled_at||'').localeCompare(String(b.settled_at||'')));
  const sales=r2(ev.reduce((a,e)=>a+(+e.sales||0),0));
  const commission=r2(ev.reduce((a,e)=>a+(+e.commission||0),0));
  const owed=r2(sales-commission);
  const paid=r2(ev.reduce((a,e)=>a+(e.money_in!=null?+e.money_in:0),0));
  return{ev,sales,commission,owed,paid,left:r2(Math.max(0,owed-paid))};
}
function lineSold(l){return Math.max(0,(+l.qty_out||0)-(l.qty_back!=null?+l.qty_back:(l.qty_back_reported!=null?+l.qty_back_reported:0)));}
function eventBags(e,field){return (e.lines||[]).reduce((a,l)=>a+(+l[field]||0),0);}
function eventValue(e,field){return r2((e.lines||[]).reduce((a,l)=>a+(+l[field]||0)*(+l.unit_price||0),0));}
function preordersFor(eid){return S.preorders.filter(o=>o.event_id===eid&&o.status!=='cancelled');}
function orderLink(){return location.origin+location.pathname+'?r='+encodeURIComponent(S.rep.code||'');}

// ─── goal calculator: how much do I need to sell to earn $X? ───
const GOAL_KEY='kf_rep_goal';
const CALC={goal:null,zone:'local'};
function calcLoad(){if(CALC.goal!=null)return;let g=null;try{g=parseFloat(localStorage.getItem(GOAL_KEY));}catch(e){}CALC.goal=g>0?g:300;}
// Sales needed to earn `want` more commission, starting from `prior` sales already counted this month
function salesForCommission(prior,want){
  const r=cfgRates();if(want<=0)return 0;
  const room=Math.max(0,r.th-prior),atBase=room*r.base;
  const x=want<=atBase?want/r.base:room+(want-atBase)/r.top;
  return Math.ceil(x*100)/100;
}
// What share of bags falls in each price group: from what this Highlander has sold, or an even mix
function calcMix(){
  const c={},keys=Object.keys((S.cfg&&S.cfg.prices)||{handmade:1,extruded:1,traditional:1}).sort((x,y)=>priceFor(y,'local')-priceFor(x,'local'));
  (S.events||[]).filter(e=>e.status==='settled').forEach(e=>(e.lines||[]).forEach(l=>{const n=lineSold(l);if(n>0)c[l.line]=(c[l.line]||0)+n;}));
  const tot=Object.values(c).reduce((a,b)=>a+b,0);
  if(tot>=10)return{from:'what you’ve sold',share:Object.fromEntries(keys.map(k=>[k,(c[k]||0)/tot]))};
  return{from:'an even mix',share:Object.fromEntries(keys.map(k=>[k,1/keys.length]))};
}
function calcHTML(mode){
  calcLoad();
  const rep=mode==='rep';
  let h='<div class="card" id="calcCard"><h2>'+(rep?'Set a goal':'What could you make?')+'</h2>'
    +'<p class="muted">'+(rep?'How much do you want to earn this month? We’ll show what it takes.':'Pick an amount you’d like to earn in a month and see how much pasta that is.')+'</p>'
    +'<div class="goal-row"><span class="dollar">$</span><input id="calcGoal" class="inp" type="number" inputmode="decimal" min="0" step="10" value="'+CALC.goal+'" oninput="calcSet(this.value)" aria-label="Goal in dollars"><span class="muted">'+(rep?'this month':'a month')+'</span></div>'
    +'<div class="chips">'+[100,250,500,1000].map(v=>'<button type="button" class="'+(+CALC.goal===v?'on':'')+'" onclick="calcSet('+v+',true)">'+fmt0(v)+'</button>').join('')+'</div>'
    +'<div class="seg2"><button type="button" class="'+(CALC.zone==='local'?'on':'')+'" onclick="CALC.zone=\'local\';calcRedraw()">Local events</button><button type="button" class="'+(CALC.zone==='far'?'on':'')+'" onclick="CALC.zone=\'far\';calcRedraw()">Farther out (+'+fmt0((S.cfg||{}).far_add||0)+'/bag)</button></div>'
    +'<div id="calcOut"></div></div>';
  return h;
}
function calcSet(v,redraw){
  CALC.goal=Math.max(0,parseFloat(v)||0);try{localStorage.setItem(GOAL_KEY,String(CALC.goal));}catch(e){}
  if(redraw){const i=$('calcGoal');if(i)i.value=CALC.goal;}
  document.querySelectorAll('#calcCard .chips button').forEach(b=>b.classList.toggle('on',b.textContent===fmt0(CALC.goal)));
  calcDraw();
}
function calcRedraw(){const card=$('calcCard');if(!card)return;const mode=S.rep&&S.rep.status==='active'?'rep':'prospect';const t=document.createElement('div');t.innerHTML=calcHTML(mode);card.replaceWith(t.firstChild);calcDraw();}
function calcDraw(){
  const out=$('calcOut');if(!out||!S.cfg)return;
  const rep=!!(S.rep&&S.rep.status==='active'),c=S.cfg,r=cfgRates(),goal=+CALC.goal||0;
  const m=rep?monthSummary(ym(today())):{sales:0,commission:0};
  const want=r2(goal-m.commission);
  if(!goal){out.innerHTML='';return;}
  if(want<=0){out.innerHTML='<div class="calc-out"><div class="calc-big">You made it!</div><p class="muted" style="margin-top:6px;">You’ve already earned '+fmt0(m.commission)+' this month, past your '+fmt0(goal)+' goal. Set a bigger one?</p></div>';return;}
  const sales=salesForCommission(m.sales,want);
  const mix=calcMix(),keys=Object.keys(mix.share);
  const avg=keys.reduce((a,k)=>a+mix.share[k]*priceFor(k,CALC.zone),0)||1;
  const bags=Math.ceil(sales/avg);
  const hitsTop=m.sales+sales>r.th;
  let h='<div class="calc-out"><div class="muted small">'+(rep&&m.commission>0?'You’ve earned '+fmt0(m.commission)+' so far. To reach '+fmt0(goal)+', sell about':'To earn '+fmt0(goal)+', sell about')+'</div>'
    +'<div class="calc-big">'+fmt0(Math.ceil(sales))+' <span style="font-size:18px;">'+(rep&&m.sales>0?'more ':'')+'in pasta</span></div>'
    +'<div class="muted" style="margin-top:4px;">That’s about <b>'+plural(bags,'bag')+'</b> at '+(mix.from==='what you’ve sold'?'your usual mix':'an even mix of all three kinds')+'.</div>';
  h+='<div class="calc-rows"><div class="muted small" style="display:block;padding-bottom:2px;">Or if you only sold one kind:</div>'
    +keys.map(k=>'<div><span>'+esc(lineName(k))+' at '+fmt0(priceFor(k,CALC.zone))+'</span><b>'+plural(Math.ceil(sales/priceFor(k,CALC.zone)),'bag')+'</b></div>').join('')+'</div>';
  if(rep){
    const done=(S.events||[]).filter(e=>e.status==='settled'&&+e.sales>0);
    if(done.length){const per=done.reduce((a,e)=>a+(+e.sales||0),0)/done.length;h+='<div class="calc-rows"><div><span>Your events average '+fmt0(Math.round(per))+' in sales</span><b>≈ '+plural(Math.max(1,Math.ceil(sales/per)),'event')+'</b></div></div>';}
  }
  h+='<p class="muted small" style="margin-top:10px;">'+(hitsTop?'This counts '+c.top_rate+'% on everything past '+fmt0(r.th)+' in the month'+(m.sales>=r.th?', which you’ve already reached.':'.'):'All of this earns '+c.base_rate+'%. Past '+fmt0(r.th)+' in a month, you’d keep '+c.top_rate+'%.')+'</p></div>';
  out.innerHTML=h;
}

const EVENT_TYPES={farmers_market:'Farmers market',craft_show:'Craft show',bazaar:'Bazaar or church sale',festival:'Festival or fair',private:'Private party',other:'Something else'};
function typeName(k){return EVENT_TYPES[k]||'';}
function peoplePerBag(){const n=+(S.cfg&&S.cfg.people_per_bag);return n>0?n:15;}
// About one bag for every 15 people (the kitchen can change this), rounded to 5s
function estimateBags(att){att=+att||0;if(att<=0)return 0;return Math.min(500,Math.max(10,Math.round(att/peoplePerBag()/5)*5));}
function avgBagPrice(zone){const mix=calcMix();return Object.keys(mix.share).reduce((a,k)=>a+mix.share[k]*priceFor(k,zone),0)||priceFor('handmade',zone)||1;}
// What this Highlander's own settled events say: people per bag sold
function myPeoplePerBag(){
  let ppl=0,bags=0,n=0;
  (S.events||[]).filter(e=>e.status==='settled'&&+e.attendance>0).forEach(e=>{const b=(e.lines||[]).reduce((a,l)=>a+lineSold(l),0);if(b>0){ppl+=+e.attendance;bags+=b;n++;}});
  return n>=2?{per:Math.round(ppl/bags),n}:null;
}
function telLink(v){const t=String(v||'').replace(/[^\d+]/g,'');return t.length>=7?'<a href="tel:'+esc(t)+'">'+esc(v)+'</a>':esc(v);}
function webLink(v,label){v=String(v||'').trim();if(!v)return'';const u=/^https?:\/\//i.test(v)?v:'https://'+v;return '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(label||v.replace(/^https?:\/\//i,'').replace(/\/$/,''))+'</a>';}
function contactKV(o){
  const r=[];
  if(o.contact_name)r.push(['Contact',esc(o.contact_name)]);
  if(o.contact_phone)r.push(['Phone',telLink(o.contact_phone)]);
  if(o.contact_email)r.push(['Email','<a href="mailto:'+esc(o.contact_email)+'">'+esc(o.contact_email)+'</a>']);
  if(o.website)r.push(['Website',webLink(o.website)]);
  if(o.booth_fee)r.push(['Booth fee',esc(o.booth_fee)]);
  return r;
}
function kvHTML(rows){return rows.length?'<div class="kv">'+rows.map(([k,v])=>'<div><span>'+k+'</span><div>'+v+'</div></div>').join('')+'</div>':'';}

// ─── weekly event search: events-feed.json on the website ───
const FEED_KEYS=['feed_id','name','kind','schedule','next_date','end_date','start_time','place','city','zone','attendance','contact_name','contact_phone','contact_email','website','booth_fee','apply_by','notes','source_url','found'];
const FEED_KINDS=['farmers_market','craft_show','festival','bazaar','private','other'];
function feedClean(f){
  if(!f||typeof f!=='object')return null;
  const o={};FEED_KEYS.forEach(k=>{const v=f[k];o[k]=v==null||v===''?null:(typeof v==='number'?v:String(v).slice(0,1000));});
  if(!o.feed_id||!o.name)return null;
  ['next_date','end_date','apply_by','found'].forEach(k=>{if(o[k]&&!/^\d{4}-\d{2}-\d{2}$/.test(o[k]))o[k]=null;});
  o.attendance=o.attendance!=null&&+o.attendance>0?Math.min(1000000,Math.round(+o.attendance)):null;
  if(!FEED_KINDS.includes(o.kind))o.kind='other';
  if(o.zone!=='far')o.zone='local';
  ['website','source_url'].forEach(k=>{if(o[k]&&!/^https?:\/\//i.test(o[k]))o[k]=null;});
  return o;
}
async function loadFeed(){
  try{const r=await fetch('events-feed.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)return[];const j=await r.json();return (Array.isArray(j)?j:(j&&j.events)||[]).map(feedClean).filter(Boolean);}
  catch(e){return[];}
}
function feedKey(n,d){return String(n||'').toLowerCase().replace(/[^a-z0-9]+/g,'')+'|'+(d||'');}
// Feed events that aren't on the list yet (or that the kitchen hid)
function feedNew(rows,feed,todayISO){
  const ids=new Set(rows.filter(r=>r.feed_id).map(r=>r.feed_id));
  const keys=new Set(rows.map(r=>feedKey(r.name,r.next_date))),names=new Set(rows.map(r=>feedKey(r.name,'')));
  return feed.filter(f=>{const last=f.end_date||f.next_date;if(last&&last<todayISO)return false;
    return !ids.has(f.feed_id)&&!keys.has(feedKey(f.name,f.next_date))&&!(!f.next_date&&names.has(feedKey(f.name,'')));});
}
function isNewThisWeek(d,todayISO){if(!d)return false;const a=new Date(d+'T12:00:00'),b=new Date(todayISO+'T12:00:00');return (b-a)/864e5<=7&&(b-a)>=-1;}

  const e=S.events.find(x=>x.id===id);if(!e)return;
  const qty={};(e.lines||[]).forEach(l=>{if(l.product_id)qty[l.product_id]=+l.qty_requested||0;});
  S.draft={id:e.id,name:e.name,event_date:e.event_date,start_time:e.start_time||'',place:e.place||'',city:e.city||'',zone:e.zone,rep_note:e.rep_note||'',show_on_order_page:e.show_on_order_page!==false,qty,share:false,bagsTouched:true};
  DRAFT_EXTRA.forEach(k=>{S.draft[k]=e[k]==null?'':e[k];});
  if(!S.draft.bags_wanted){const n=Object.values(qty).reduce((a,b)=>a+b,0);S.draft.bags_wanted=n||'';}
  go('book');
}
async function cancelBooking(id){
  const e=S.events.find(x=>x.id===id);if(!e||!confirm('Cancel '+e.name+'? The kitchen won’t set pasta aside for it.'))return;

}

function setAttendance(v){
  const d=S.draft;d.attendance=v;
  if(!d.bagsTouched){const n=estimateBags(v);d.bags_wanted=n||'';const i=$('q_bags');if(i)i.value=n||0;}
  drawEst();drawBookTotal();
}
function setBags(v){S.draft.bags_wanted=Math.min(500,Math.max(0,v|0));S.draft.bagsTouched=true;drawEst();drawBookTotal();}
function drawEst(){
  const el=$('bEst');if(!el)return;const d=S.draft,att=+d.attendance||0;
  if(!att){el.innerHTML='<p class="muted small" style="margin-top:6px;">Not sure? Ask the organizer, or guess. About one bag for every '+peoplePerBag()+' people is a good start.</p>';return;}
  const n=estimateBags(att),mine=myPeoplePerBag();
  el.innerHTML='<div class="est">For about '+att.toLocaleString('en-US')+' people, bring about <b>'+n+'</b> bags.'
    +(+d.bags_wanted&&+d.bags_wanted!==n?'<div class="small" style="margin-top:4px;">You’re asking for '+plural(+d.bags_wanted,'bag')+'. <a href="#" onclick="useEstimate();return false;">Use '+n+'</a></div>':'')
    +(mine?'<div class="small" style="margin-top:4px;">At your last '+mine.n+' events you sold about 1 bag for every '+mine.per+' people.</div>':'')+'</div>';
}
function useEstimate(){const n=estimateBags(S.draft.attendance);S.draft.bags_wanted=n;S.draft.bagsTouched=true;const i=$('q_bags');if(i)i.value=n;drawEst();drawBookTotal();}
function stepper(id,v,onset){
  const set=onset.replace('VAL','v');
  return '<div class="step"><button type="button" aria-label="One less" onclick="(function(){var i=document.getElementById(\''+id+'\');var v=Math.max(0,(parseInt(i.value)||0)-1);i.value=v;'+set+'})()">−</button>'
    +'<input id="'+id+'" type="number" inputmode="numeric" min="0" value="'+v+'" oninput="(function(i){var v=Math.max(0,parseInt(i.value)||0);'+set+'})(this)">'
    +'<button type="button" aria-label="One more" onclick="(function(){var i=document.getElementById(\''+id+'\');var v=(parseInt(i.value)||0)+1;i.value=v;'+set+'})()">+</button></div>';
}
function setZone(z){S.draft.zone=z;renderBook();}
function drawBookTotal(){
  const d=S.draft,el=$('bookTotal');if(!el)return;
  const bags=+d.bags_wanted||0,val=Math.round(bags*avgBagPrice(d.zone));
  if(!bags){el.innerHTML='';return;}
  el.innerHTML='<div class="total-bar"><div><div class="s">'+plural(bags,'bag')+' · if it all sells</div><div class="big">about '+fmt0(val)+'</div></div><div style="text-align:right;"><div class="s">you’d earn about</div><div class="big">'+fmt0(addCommission(0,val))+'</div></div></div>'
    +'<p class="muted small" style="margin-top:6px;">An estimate. The real number depends on the mix the kitchen packs.</p>';
}
async function saveBooking(){
  const d=S.draft,msg=$('bMsg'),btn=$('bBtn');msg.textContent='';
  if(!d.name.trim()){msg.textContent='Give the event a name.';return;}
  if(!d.event_date){msg.textContent='Pick the date.';return;}
  const bags=+d.bags_wanted||0;
  if(bags<1){msg.textContent=+d.attendance>0?'Say how many bags you’d like.':'Tell us about how many people come, or how many bags you’d like.';return;}
  if(bags>500){msg.textContent='That’s more than 500 bags. Talk to the kitchen about an event that big.';return;}
  btn.disabled=true;btn.textContent='Saving…';
  try{
    let lid=d.listing_id||'';
    if(!d.id&&!lid&&d.share&&!d.fromList){
      try{lid=await rpc('kf_hl_save_listing',{p:{name:d.name.trim(),kind:d.event_type||'other',next_date:d.event_date,start_time:d.start_time,place:d.place,city:d.city,zone:d.zone,attendance:String(d.attendance||''),contact_name:d.contact_name,contact_phone:d.contact_phone,contact_email:d.contact_email,website:d.website,booth_fee:d.booth_fee}});}
      catch(x){lid='';}
    }
    const ev={id:d.id,name:d.name.trim(),event_date:d.event_date,start_time:d.start_time,place:d.place,city:d.city,zone:d.zone,rep_note:d.rep_note,show_on_order_page:d.show_on_order_page,
      listing_id:lid||'',event_type:d.event_type||'',attendance:String(d.attendance||''),bags_wanted:String(bags),contact_name:d.contact_name||'',contact_phone:d.contact_phone||'',contact_email:d.contact_email||'',website:d.website||'',booth_fee:d.booth_fee||''};
    await rpc('kf_hl_book_event',{p_event:ev});
    toast(d.id?'Booking updated':'Booked! The kitchen will pack '+plural(bags,'bag')+' for you.');S.draft=null;await reload('events');
  }catch(e){msg.textContent=/kf_hl_book_event|schema cache|PGRST202/i.test(e.message)?'The kitchen is finishing an update to booking. Try again a little later.':e.message;btn.disabled=false;btn.textContent=d.id?'Save changes':'Book it';}
}

function startCount(id){
  const e=S.events.find(x=>x.id===id);if(!e)return;
  S.count={id,back:{}};(e.lines||[]).forEach(l=>{S.count.back[l.id]=l.qty_back_reported!=null?+l.qty_back_reported:0;});
  go('count');
}
function renderCount(){
  const c=S.count,e=c&&S.events.find(x=>x.id===c.id);if(!e){go('events');return;}
  let h='<div class="card"><h2>'+esc(e.name)+'</h2><p class="muted">'+esc(dayLabel(e.event_date))+'. Count the bags you’re bringing back for each kind. We’ll work out what sold.</p>';
  (e.lines||[]).forEach(l=>{
    h+='<div class="prod"><div class="prod-main"><div class="prod-name">'+esc(l.product_name)+'</div><div class="prod-sub">Took '+l.qty_out+' · '+fmt0(l.unit_price)+' each</div></div>'
      +'<div style="text-align:center;"><div class="small muted" style="margin-bottom:3px;">coming back</div>'+stepper('b_'+l.id,c.back[l.id]||0,'setBack(\''+l.id+'\',VAL)')+'</div></div>';
  });
  h+='<div id="countTotal"></div><div class="msg err" id="cMsg"></div><div class="btns"><button class="btn primary full" id="cBtn" onclick="sendCount()">Send my count</button><button class="btn soft full" onclick="go(\'events\')">Back</button></div></div>';
  $('app').innerHTML=h;drawCountTotal();
}
function setBack(lid,v){const e=S.events.find(x=>x.id===S.count.id),l=e&&(e.lines||[]).find(x=>x.id===lid);if(!l)return;const max=+l.qty_out||0;if(v>max){v=max;const i=$('b_'+lid);if(i)i.value=v;}S.count.back[lid]=v;drawCountTotal();}
function drawCountTotal(){
  const e=S.events.find(x=>x.id===S.count.id);let sold=0,val=0;
  (e.lines||[]).forEach(l=>{const s=Math.max(0,(+l.qty_out||0)-(S.count.back[l.id]||0));sold+=s;val+=s*(+l.unit_price||0);});
  const k=ym(e.event_date),prior=monthSummary(k).ev.filter(x=>x.event_date<=e.event_date&&x.id!==e.id).reduce((a,x)=>a+(+x.sales||0),0);
  const earn=addCommission(prior,val);
  $('countTotal').innerHTML='<div class="total-bar"><div><div class="s">'+plural(sold,'bag')+' sold</div><div class="big">'+fmt0(val)+'</div></div><div style="text-align:right;"><div class="s">you keep about</div><div class="big">'+fmt0(earn)+'</div></div></div>'
    +'<p class="muted small" style="margin-top:8px;">Bring the kitchen '+fmt(r2(val-earn))+' (sales minus your commission) along with the unsold bags. The kitchen confirms the count when you drop off.</p>';
}
async function sendCount(){
  const btn=$('cBtn');btn.disabled=true;btn.textContent='Sending…';
  try{await rpc('kf_rep_report_back',{p_id:S.count.id,p_lines:Object.entries(S.count.back).map(([line_id,back])=>({line_id,back}))});toast('Count sent. Thanks!');S.count=null;await reload('events');}
  catch(e){$('cMsg').textContent=e.message;btn.disabled=false;btn.textContent='Send my count';}
}

// ─── pre-orders ───
function renderOrders(){
  const evById={};S.events.forEach(e=>evById[e.id]=e);
  const groups={};S.preorders.forEach(o=>{const k=o.event_id||'none';(groups[k]=groups[k]||[]).push(o);});
  const keys=Object.keys(groups).sort((a,b)=>{const ea=evById[a],eb=evById[b];const da=ea?ea.event_date:'0',db=eb?eb.event_date:'0';const up=x=>x>=today()?0:1;return up(da)-up(db)||(up(da)?db.localeCompare(da):da.localeCompare(db));});
  let h='<div class="card"><h2>Get more pre-orders</h2><p class="muted">People reserve on your link and pay you when they pick up at the event.</p><div class="btns"><button class="btn tan" onclick="shareLink()">Share my order link</button><button class="btn soft" onclick="copy(orderLink(),\'Order link copied\')">Copy link</button></div></div>';
  if(!keys.length)h+='<div class="card empty">No pre-orders yet.</div>';
  keys.forEach(k=>{
    const e=evById[k],list=groups[k];
    const live=list.filter(o=>o.status!=='cancelled');const need={};live.forEach(o=>(o.items||[]).forEach(i=>{need[i.name]=(need[i.name]||0)+(+i.qty||0);}));
    h+='<div class="section-t">'+(e?esc(e.name)+' · '+esc(dayLabel(e.event_date)):'No event')+'</div><div class="card">';
    if(Object.keys(need).length)h+='<div class="msg ok" style="margin-top:0;margin-bottom:6px;">Set aside: '+Object.entries(need).map(([n,q])=>'<b>'+q+'</b> '+esc(n)).join(', ')+'</div>';
    list.forEach(o=>{
      const contact=o.customer_contact||'',tel=contact.replace(/[^\d+]/g,'');
      const clink=/@/.test(contact)?'<a href="mailto:'+esc(contact)+'">'+esc(contact)+'</a>':tel.length>=7?'<a href="tel:'+esc(tel)+'">'+esc(contact)+'</a>':esc(contact);
      const chip={new:'<span class="chip blue">New</span>',confirmed:'<span class="chip green">Confirmed</span>',picked_up:'<span class="chip">Picked up</span>',cancelled:'<span class="chip red">Cancelled</span>'}[o.status];
      h+='<div class="order"><div class="order-top"><div><b>'+esc(o.customer_name)+'</b> '+chip+'<div class="muted small">'+clink+'</div></div><b>'+fmt(o.total)+'</b></div>'
        +'<div class="small" style="margin-top:4px;">'+(o.items||[]).map(i=>(+i.qty)+'× '+esc(i.name)).join(', ')+'</div>'
        +(o.note?'<div class="muted small" style="margin-top:2px;">“'+esc(o.note)+'”</div>':'')
        +(o.status!=='cancelled'&&o.status!=='picked_up'?'<div class="btns" style="margin-top:8px;">'+(o.status==='new'?'<button class="btn sm soft" onclick="setOrder(\''+o.id+'\',\'confirmed\')">Confirm</button>':'')+'<button class="btn sm primary" onclick="setOrder(\''+o.id+'\',\'picked_up\')">Picked up</button><button class="btn sm danger" onclick="setOrder(\''+o.id+'\',\'cancelled\')">Cancel</button></div>':'')+'</div>';
    });
    h+='</div>';
  });
  $('app').innerHTML=h;
}
async function setOrder(id,st){

  catch(e){toast(e.message,true);}
}

  $('hTitle').textContent='Reserve handmade pasta';$('hSub').textContent='Pay when you pick it up';
  try{O.data=await rpc('kf_rep_public',{p_code:code});}catch(e){O.data={ok:false,err:e.message};}
  if(!O.data||!O.data.ok){$('app').innerHTML='<div class="card center"><div class="hero-ico">🍝</div><h2>This order link isn’t active</h2><p class="muted">'+(O.data&&O.data.err?esc(O.data.err):'Double-check the link with the person who shared it.')+'</p></div>';return;}
  S.cfg=Object.assign({},S.cfg||{},{line_names:O.data.line_names});
  const first=O.data.rep.first_name;
  $('hTitle').textContent='Pasta from '+first;
  $('hSub').textContent='The Kilted Farmers · handmade in Concord, MI';
  if(!O.data.events.length){$('app').innerHTML='<div class="card center"><div class="hero-ico">🍝</div><h2>No upcoming events right now</h2><p class="muted">'+esc(first)+' doesn’t have an event open for pre-orders yet. Check back soon.</p></div>';return;}
  if(!O.event||!O.data.events.some(e=>e.id===O.event))O.event=O.data.events.length===1?O.data.events[0].id:null;
  drawOrderPage();
}
function oZone(){const e=O.data.events.find(x=>x.id===O.event);return e?e.zone:'local';}
function oPrice(p){return r2(+p.price+(oZone()==='far'?+O.data.far_add||0:0));}
function drawOrderPage(){
  const first=O.data.rep.first_name;
  let h='<div class="card"><h2>Pick your event</h2><p class="muted">Reserve bags now and pay '+esc(first)+' when you pick them up.</p>';
  O.data.events.forEach(e=>{
    h+='<label class="pick'+(O.event===e.id?' on':'')+'"><input type="radio" name="oev" '+(O.event===e.id?'checked':'')+' onchange="O.event=\''+e.id+'\';drawOrderPage()"><b>'+esc(e.name)+'</b><br><span class="muted">'+esc(dayLabel(e.event_date))+(e.start_time?' · '+esc(e.start_time):'')+(e.place||e.city?'<br>'+esc([e.place,e.city].filter(Boolean).join(', ')):'')+'</span></label>';
  });
  h+='</div>';
  if(O.event){
    h+='<div class="card"><h2>Choose your pasta</h2>';let last=null;
    O.data.products.forEach(p=>{
      if(p.line!==last){last=p.line;h+='<div class="line-h">'+esc(lineName(p.line))+' · '+fmt0(oPrice(p))+' a bag</div>';}
      h+='<div class="prod"><div class="prod-main"><div class="prod-name">'+esc(p.name)+'</div>'+(p.description?'<div class="prod-sub">'+esc(p.description)+'</div>':'')+'</div>'+stepper('o_'+p.id,O.qty[p.id]||0,'oQty(\''+p.id+'\',VAL)')+'</div>';
    });
    h+='<div id="oTotal"></div></div>';
    h+='<div class="card"><h2>Your details</h2>'
      +'<label for="oName">Name</label><input id="oName" class="inp" autocomplete="name">'
      +'<label for="oContact">Phone or email</label><input id="oContact" class="inp" autocomplete="tel" placeholder="So '+esc(first)+' can reach you">'
      +'<label for="oNote">Note (optional)</label><input id="oNote" class="inp" placeholder="Anything '+esc(first)+' should know">'
      +'<div class="msg err" id="oMsg"></div><div class="btns"><button class="btn primary full" id="oBtn" onclick="placeOrder()">Reserve my pasta</button></div>'
      +'<p class="muted small center" style="margin-top:10px;">Nothing to pay now. You’ll pay '+esc(first)+' at pickup.</p></div>';
  }
  $('app').innerHTML=h;if(O.event)drawOTotal();
}
function oQty(pid,v){O.qty[pid]=Math.min(25,Math.max(0,v|0));const i=$('o_'+pid);if(i&&+i.value!==O.qty[pid])i.value=O.qty[pid];drawOTotal();}
function drawOTotal(){
  let bags=0,t=0;O.data.products.forEach(p=>{const q=O.qty[p.id]||0;bags+=q;t+=q*oPrice(p);});
  $('oTotal').innerHTML=bags?'<div class="total-bar"><div><div class="s">'+plural(bags,'bag')+'</div><div class="big">'+fmt(t)+'</div></div><div class="s" style="text-align:right;">paid at pickup</div></div>':'';
}
async function placeOrder(){
  const msg=$('oMsg'),btn=$('oBtn');msg.textContent='';
  const items=Object.entries(O.qty).filter(([,q])=>q>0).map(([product_id,qty])=>({product_id,qty}));
  if(!items.length){msg.textContent='Choose at least one bag.';return;}
  if(!$('oName').value.trim()){msg.textContent='Enter your name.';return;}
  if(!$('oContact').value.trim()){msg.textContent='Enter a phone number or email.';return;}
  btn.disabled=true;btn.textContent='Reserving…';
  try{
    const r=await rpc('kf_rep_place_preorder',{p_code:O.code,p_event:O.event,p_name:$('oName').value.trim(),p_contact:$('oContact').value.trim(),p_items:items,p_note:$('oNote').value.trim()});
    const first=O.data.rep.first_name;
    $('app').innerHTML='<div class="card center"><div class="hero-ico">🎉</div><h2>You’re all set</h2><p class="muted">'+esc(first)+' will have your pasta at <b>'+esc(r.event)+'</b> on '+esc(dayLabel(r.event_date))+(r.place||r.city?', '+esc([r.place,r.city].filter(Boolean).join(', ')):'')+'.</p>'
      +'<div class="total-bar" style="justify-content:center;"><div class="center"><div class="s">Pay at pickup</div><div class="big">'+fmt(r.total)+'</div></div></div>'
      +'<p class="muted small" style="margin-top:12px;">Need to change something? Reach out to '+esc(first)+'.</p><div class="btns" style="justify-content:center;"><button class="btn soft" onclick="O.qty={};renderOrderPage(O.code)">Place another order</button></div></div>';
    window.scrollTo(0,0);
  }catch(e){msg.textContent=e.message;btn.disabled=false;btn.textContent='Reserve my pasta';}
}

init();
</script>
</body>
</html>
