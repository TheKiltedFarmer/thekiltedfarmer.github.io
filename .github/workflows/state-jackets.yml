# ─────────────────────────────────────────────────────────────────────────
# The People's Voices: Sponsor Jackets for Michigan's state officials
#
# Every morning this downloads Michigan's campaign finance files (the state
# refreshes them overnight), works out every state official's jacket, checks
# the House and Senate websites for new members, and sends the numbers to the
# site. It uses the key from tpv_state_jackets.sql, saved in this repository
# as a secret named TPV_JACKETS_KEY.
#
# To run it now: Actions tab → "Sponsor Jackets (Michigan)" → Run workflow.
# ─────────────────────────────────────────────────────────────────────────
name: Sponsor Jackets (Michigan)

on:
  schedule:
    - cron: '23 10 * * *'      # about 6:23 AM in Michigan, after the state's overnight refresh
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update the Michigan jackets
        env:
          TPV_JACKETS_KEY: ${{ secrets.TPV_JACKETS_KEY }}
        run: |
          cat > state-jackets.mjs <<'TPV_SCRIPT'
          // The People's Voices: Sponsor Jackets for Michigan's state officials
          // Runs on GitHub every night (see .github/workflows/state-jackets.yml).
          // Downloads Michigan's campaign finance files (MiTN), works out each official's
          // jacket, and sends the numbers to the site through a locked door.

          const MI_OFFICES = {
            'Governor': 'gov', 'Lt. Governor': 'ltgov', 'Attorney General': 'ag', 'Secretary of State': 'sos',
            'State Senator': 'senate', 'Representative in State Legislature': 'house',
          };
          // Payment platforms that pass along individual people's gifts: not sponsors
          const MI_CONDUIT = /^(act\s*blue|winred|anedot|democracy\s*engine|numero|ngp\s*van)\b/i;
          const TOP_N = 8;
          // The two-year period shown, like the FEC's "2025–26". Michigan files by
          // statement year, and January's statement reaches back into December, so
          // every gift is counted by the date it was received.
          const MI_CYCLE = { start: '2025-01-01', end: '2026-12-31', label: '2025–26', years: [2025, 2026, 2027] };
          const miMoney = (v) => { const n = Number(String(v == null ? '' : v).replace(/[$,\s]/g, '')); return isFinite(n) ? n : 0; };
          const miClean = (s) => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
          function miNewAgg() { return { coms: new Map() }; }
          // kind: 'contribution' (Contribution_YYYY file) or 'receipt' (Receipts_YYYY file: in-kind gifts live here)
          function miAddRow(agg, o, kind) {
            if (o.com_type !== 'Candidate') return;
            const office = miClean(o.can_office_sought);
            if (!MI_OFFICES[office]) return;
            const type = miClean(o.contribtype);
            const isReceipt = kind === 'receipt';
            if (isReceipt && !/^In-Kind Contributions/i.test(type)) return;   // interest, refunds and the like aren't gifts
            const id = miClean(o.cfr_com_id);
            if (!id) return;
            const d = miClean(o.received_date);                  // MM/DD/YYYY
            const iso = /^\d{2}\/\d{2}\/\d{4}$/.test(d) ? d.slice(6) + '-' + d.slice(0, 2) + '-' + d.slice(3, 5) : '';
            if (iso ? (iso < MI_CYCLE.start || iso > MI_CYCLE.end)
                    : !(Number(o.doc_stmnt_year) >= Number(MI_CYCLE.start.slice(0, 4)) && Number(o.doc_stmnt_year) <= Number(MI_CYCLE.end.slice(0, 4)))) return;
            let c = agg.coms.get(id);
            if (!c) {
              c = { id, name: miClean(o.com_legal_name), first: miClean(o.can_first_name), last: miClean(o.can_last_name),
                office, district: miClean(o.can_district_sought), party: miClean(o.can_political_party),
                raised: 0, individuals: 0, orgs: 0, self: 0, loans: 0, inkind: 0, rows: 0, lastDate: '', sponsors: new Map() };
              agg.coms.set(id, c);
            }
            const amt = miMoney(o.amount);
            const fn = miClean(isReceipt ? o.payer_f_name : o.contributor_f_name);
            const ln = miClean(isReceipt ? o.payer_l_name_or_org : o.contributor_l_name_or_org);
            if (iso > c.lastDate) c.lastDate = iso;
            c.rows++;
            if (/Loan/i.test(type)) { c.loans += amt; return; }   // loans aren't gifts
            c.raised += amt;
            if (isReceipt) c.inkind += amt;
            const own = fn && ln && miNorm(ln) === miNorm(c.last) && miFirstMatch(fn, c.first);
            if (/Private Funds/i.test(type) || own) { c.self += amt; return; }
            if (!fn && ln && !MI_CONDUIT.test(ln)) {
              c.orgs += amt;
              const key = ln.toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
              const s = c.sponsors.get(key) || { name: ln, amount: 0 };
              s.amount += amt;
              c.sponsors.set(key, s);
            } else {
              c.individuals += amt;
            }
          }
          const r2 = (n) => Math.round(n * 100) / 100;
          function miFinish(agg) {
            return [...agg.coms.values()].map((c) => {
              const sponsors = [...c.sponsors.entries()].map(([key, s]) => ({ key, name: s.name, amount: r2(s.amount) }))
                .filter((s) => s.amount !== 0).sort((a, b) => b.amount - a.amount);
              return { id: c.id, name: c.name, first: c.first, last: c.last, office: c.office, district: c.district, party: c.party,
                raised: r2(c.raised), individuals: r2(c.individuals), orgs: r2(c.orgs), self: r2(c.self), loans: r2(c.loans),
                inkind: r2(c.inkind), rows: c.rows, lastDate: c.lastDate || null, sponsors };
            });
          }

          // ── Matching an official to their committee ─────────────────────────────
          const MI_NICK = {
            mike: ['michael'], bill: ['william'], will: ['william'], tom: ['thomas'], tim: ['timothy'], pat: ['patrick', 'patricia'],
            matt: ['matthew'], joe: ['joseph'], joey: ['joseph'], greg: ['gregory'], jim: ['james'], dan: ['daniel'], ed: ['edward'],
            steve: ['steven', 'stephen'], phil: ['philip', 'phillip'], brad: ['bradley'], ken: ['kenneth'], rick: ['richard', 'frederick'],
            jeff: ['jeffrey', 'jeffery'], sam: ['samuel', 'samantha'], sue: ['susan'], ron: ['ronald'], doug: ['douglas'], chris: ['christopher', 'christine'],
            nick: ['nicholas'], alex: ['alexander'], andy: ['andrew'], dave: ['david'], jon: ['jonathan', 'john'], kathy: ['kathleen', 'katherine', 'kathryn'],
            rob: ['robert'], bob: ['robert'], jerry: ['gerald', 'jerome'], curt: ['curtis'], nate: ['nathan'], ben: ['benjamin'], gina: ['regina'],
            donni: ['donna'], penny: ['penelope'], reggie: ['reginald'], jamie: ['james'], liz: ['elizabeth'], tony: ['anthony'],
          };
          function miNorm(s) {
            return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
              .replace(/\b(jr|sr|ii|iii|iv)\b\.?/g, ' ').replace(/[^a-z0-9]+/g, '');
          }
          function miFirstMatch(a, b) {
            const x = String(a || '').toLowerCase().replace(/[^a-z ]/g, ' ').trim().split(/\s+/)[0] || '';
            const y = String(b || '').toLowerCase().replace(/[^a-z ]/g, ' ').trim().split(/\s+/)[0] || '';
            if (!x || !y) return false;
            if (x === y) return true;
            return (MI_NICK[x] || []).includes(y) || (MI_NICK[y] || []).includes(x);
          }
          // Last name as printed on the roster: "Joseph Bellino Jr." → Bellino, "Alicia St. Germaine" → St. Germaine
          function miLastName(full) {
            const words = String(full || '').replace(/,?\s+(jr|sr|ii|iii|iv)\.?$/i, '').trim().split(/\s+/);
            if (words.length >= 3 && /^(st\.?|van|vander|de|del|la|le|mc|o')$/i.test(words[words.length - 2])) return words.slice(-2).join(' ');
            return words[words.length - 1] || '';
          }
          const miDistNum = (s) => { const m = String(s || '').match(/\d+/); return m ? Number(m[0]) : null; };
          // official: {id, name, seat: 'gov'|'ltgov'|'ag'|'sos'|'senate'|'house', district_num, mi_committee_ids?}
          // Returns every committee of theirs with 2025–26 money: the one for the seat
          // they hold, and any for a race they're running in now (State House member
          // running for State Senate, say). Same first and last name is required, so a
          // relative running for the same seat isn't mixed in.
          function miMatch(official, coms) {
            const pinnedIds = (official.mi_committee_ids || []).map((x) => String(x).trim()).filter(Boolean);
            if (pinnedIds.length) return { committees: coms.filter((c) => pinnedIds.includes(c.id)), pinned: true };
            const last = miNorm(miLastName(official.name));
            const first = official.name.trim().split(/\s+/)[0];
            const named = [], seatOnly = [];
            for (const c of coms) {
              if (miNorm(c.last) !== last && !(last.length > 5 && miNorm(c.last).endsWith(last))) continue;
              const om = MI_OFFICES[c.office] === official.seat;
              const dm = om && (official.district_num == null || miDistNum(c.district) === official.district_num);
              if (miFirstMatch(first, c.first)) named.push(c);
              else if (dm) seatOnly.push(c);
            }
            // Nobody with their first name (a nickname we don't know): fall back to the one committee for their exact seat
            const found = named.length ? named : seatOnly.sort((a, b) => b.raised - a.raised).slice(0, 1);
            return { committees: found.sort((a, b) => b.raised - a.raised), pinned: false };
          }
          // ── One official's jacket row ──────────────────────────────────────────
          const MI_OFFICE_TITLE = { gov: 'Governor', ltgov: 'Lieutenant Governor', ag: 'Attorney General', sos: 'Secretary of State', senate: 'State Senator', house: 'State Representative' };
          // opts.sharedLast: another official has the same last name (Tyrone and Brenda Carter),
          // so "CARTER FOR MICHIGAN" can't be assumed to be their own committee
          function miJacketRow(official, m, opts = {}) {
            const list = m.committees || [];
            const base = { id: official.id, mi_committee_ids: list.map((c) => c.id), mi_committee_names: list.map((c) => c.name) };
            if (!list.length) return { ...base, status: 'none_filed', total_raised: null, from_individuals: null, from_pacs: null,
              self_funded: null, in_kind: null, own_committees: null, top_pacs: [], sponsor_count: 0, coverage_end: null, other_races: [],
              refresh_error: m.pinned ? 'No 2025–26 contributions under that committee number in Michigan\'s files.' : null };
            // Money one of their own committees passed to another is counted once
            const own = new Set(list.map((c) => c.name.toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim()));
            const sum = (k) => r2(list.reduce((n, c) => n + (Number(c[k]) || 0), 0));
            const merged = new Map();
            let transfers = 0;
            for (const c of list) for (const sp of c.sponsors) {
              if (own.has(sp.key)) { transfers += sp.amount; continue; }
              const cur = merged.get(sp.key) || { name: sp.name, amount: 0 };
              cur.amount += sp.amount;
              merged.set(sp.key, cur);
            }
            // Their own leadership fund or an old campaign of theirs ("BAYER FOR MICHIGAN",
            // "WEBBER MAJORITY FUND") is money they moved to themselves, not a sponsor
            const up = (x) => ' ' + String(x || '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim() + ' ';
            const lastKey = up(miLastName(official.name));
            const firstWord = official.name.trim().split(/\s+/)[0].toLowerCase().replace(/[^a-z]/g, '');
            const firstKeys = [firstWord, ...(MI_NICK[firstWord] || []), ...Object.keys(MI_NICK).filter((k) => MI_NICK[k].includes(firstWord))].map(up);
            const isOwn = (key) => { const k = up(key); return k.includes(lastKey) && (firstKeys.some((f) => k.includes(f)) || (!opts.sharedLast && /\b(FOR|MAJORITY|LEADERSHIP|FRIENDS|ELECT|CTE)\b/.test(k))); };
            let ownMoved = 0;
            for (const [key, sp] of [...merged.entries()]) if (isOwn(key)) { ownMoved += sp.amount; merged.delete(key); }
            const sponsors = [...merged.values()].filter((s) => s.amount > 0.5).sort((a, b) => b.amount - a.amount);
            const isSeat = (c) => MI_OFFICES[c.office] === official.seat && (official.district_num == null || miDistNum(c.district) === official.district_num);
            const races = [];
            for (const c of list) if (!isSeat(c) && c.raised > 0) {
              const r = { office: c.office, district: /^statewide$/i.test(c.district) ? null : (c.district || null) };
              if (!races.some((x) => x.office === r.office && x.district === r.district)) races.push(r);
            }
            const rows = list.reduce((n, c) => n + c.rows, 0);
            return { ...base, status: rows > 0 ? 'reported' : 'none_filed',
              total_raised: r2(sum('raised') - transfers), from_individuals: sum('individuals'), from_pacs: r2(sum('orgs') - transfers - ownMoved),
              self_funded: sum('self'), in_kind: sum('inkind'), own_committees: r2(ownMoved),
              top_pacs: sponsors.slice(0, TOP_N).map((s) => ({ name: s.name, amount: r2(s.amount) })), sponsor_count: sponsors.length,
              coverage_end: list.map((c) => c.lastDate).filter(Boolean).sort().pop() || null,
              other_races: races, refresh_error: null };
          }
          function miSharedLastNames(roster) {
            const n = new Map();
            for (const o of roster) { const k = miNorm(miLastName(o.name)); n.set(k, (n.get(k) || 0) + 1); }
            return new Set([...n.entries()].filter(([, c]) => c > 1).map(([k]) => k));
          }

          // ── The nightly run ─────────────────────────────────────────────────────
          import zlib from 'node:zlib';
          import { Readable } from 'node:stream';
          import { StringDecoder } from 'node:string_decoder';

          const env = process.env;
          const KEY = env.TPV_JACKETS_KEY;
          const SITE = env.TPV_SITE_URL || 'https://thepeoplesvoices.org/';
          const MITN = env.MITN_BASE || 'https://mi-boe.entellitrak.com/etk-mi-boe-prod/';
          const HOUSE_URL = env.HOUSE_URL || 'https://www.house.mi.gov/AllRepresentatives';
          const SENATE_URL = env.SENATE_URL || 'https://senate.michigan.gov/senators/all-senators/';
          const DRY = env.DRY_RUN === '1';
          const UA = 'Mozilla/5.0 (compatible; ThePeoplesVoices/1.0; +https://thepeoplesvoices.org)';
          const log = (...a) => console.log(...a);
          const DRY_CALLS = [];

          async function get(url, opts = {}) {
            for (let i = 0; i < 3; i++) {
              try {
                const r = await fetch(url, { ...opts, headers: { 'User-Agent': UA, ...(opts.headers || {}) } });
                if (r.ok) return r;
                if (r.status < 500 && r.status !== 429) throw new Error(url + ' answered ' + r.status);
              } catch (e) { if (i === 2) throw e; }
              await new Promise((res) => setTimeout(res, 4000 * (i + 1)));
            }
            throw new Error(url + ' could not be reached');
          }

          // The site's public database address and key (the same ones every visitor's browser uses)
          async function siteKeys() {
            if (env.SUPA_URL && env.SUPA_KEY) return { url: env.SUPA_URL, key: env.SUPA_KEY };
            const html = await (await get(SITE)).text();
            const url = (html.match(/SUPA_URL\s*=\s*"([^"]+)"/) || [])[1];
            const key = (html.match(/SUPA_KEY\s*=\s*"([^"]+)"/) || [])[1];
            if (!url || !key) throw new Error('Could not find the site\'s database address in ' + SITE);
            return { url, key };
          }
          async function rpc(db, fn, body) {
            if (DRY && fn !== 'tpv_state_money_roster' && !env.ROSTER_FILE) { log('DRY RUN: would call', fn); return { ok: true }; }
            if (fn === 'tpv_state_money_roster' && env.ROSTER_FILE) return JSON.parse((await import('node:fs')).readFileSync(env.ROSTER_FILE, 'utf8'));
            if (DRY) { DRY_CALLS.push(body); (await import('node:fs')).writeFileSync(env.DRY_OUT || 'dry-run.json', JSON.stringify(DRY_CALLS)); return { ok: true, dry: true }; }
            const r = await fetch(db.url + '/rest/v1/rpc/' + fn, {
              method: 'POST',
              headers: { apikey: db.key, Authorization: 'Bearer ' + db.key, 'Content-Type': 'application/json' },
              body: JSON.stringify(body || {}),
            });
            const t = await r.text();
            if (!r.ok) throw new Error(fn + ' failed (' + r.status + '): ' + t.slice(0, 300));
            return t ? JSON.parse(t) : null;
          }

          // The two-year period shown. It switches to the new one in July of odd years,
          // so newly sworn-in legislators keep showing the money from the race that seated them.
          function cycleNow(d = new Date()) {
            const ref = new Date(d.getTime() - 182 * 864e5);
            const start = ref.getUTCFullYear() % 2 === 1 ? ref.getUTCFullYear() : ref.getUTCFullYear() - 1;
            return { start: start + '-01-01', end: (start + 1) + '-12-31', label: start + '–' + String(start + 1).slice(2), years: [start, start + 1, start + 2] };
          }

          // ── Who holds each seat, from the House and Senate websites ─────────────
          const strip = (html) => html.replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' ')
            .replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&#39;|&#x27;|&rsquo;/g, '\'').replace(/&quot;/g, '"').replace(/\s+/g, ' ');
          const PARTY = (p) => /^rep/i.test(p || '') ? 'Republican' : /^dem/i.test(p || '') ? 'Democrat' : /^ind/i.test(p || '') ? 'Independent' : null;
          async function houseRoster() {
            const text = strip(await (await get(HOUSE_URL)).text());
            const out = new Map();
            const re = /([A-Z][A-Za-z'’.\- ]{1,40}?), Rep\. ([A-Z][A-Za-z'’.\- ]{0,40}?)\s*(?:\(([A-Za-z ]+)\))?\s*District-(\d{1,3})/g;
            let m;
            while ((m = re.exec(text))) {
              const d = Number(m[4]);
              if (d < 1 || d > 110 || out.has(d)) continue;
              out.set(d, { name: (m[2].trim() + ' ' + m[1].trim()).replace(/\s+/g, ' '), party: PARTY(m[3]) });
            }
            return out;
          }
          async function senateRoster() {
            const html = await (await get(SENATE_URL)).text();
            const m = html.match(/senatorinfo\s*=\s*(["'])([\s\S]*?)\1/i);
            if (!m) return new Map();
            const json = m[2].replace(/&quot;/g, '"').replace(/&#34;/g, '"').replace(/&#39;/g, '\'').replace(/&amp;/g, '&');
            const out = new Map();
            for (const s of JSON.parse(json)) {
              const d = Number(s.district);
              if (d >= 1 && d <= 38 && !out.has(d)) out.set(d, { name: [s.firstName, s.lastName].join(' ') + (s.suffix ? ' ' + s.suffix : ''), party: PARTY(s.party === 'R' ? 'Republican' : s.party === 'D' ? 'Democrat' : s.party) });
            }
            return out;
          }
          const samePerson = (a, b) => miNorm(miLastName(a)) === miNorm(miLastName(b)) && a.trim()[0].toLowerCase() === b.trim()[0].toLowerCase();
          async function rosterChanges(roster) {
            const changes = [];
            for (const [seat, fetcher, expect] of [['house', houseRoster, 110], ['senate', senateRoster, 38]]) {
              let found;
              try { found = await fetcher(); } catch (e) { log('⚠️  Couldn\'t read the ' + seat + ' list:', e.message); continue; }
              if (found.size < expect - 8) { log('⚠️  The ' + seat + ' list had ' + found.size + ' members (expected ' + expect + '); names left as they are.'); continue; }
              for (const o of roster.filter((x) => x.seat === seat)) {
                const now = found.get(o.district_num);
                if (!now) continue;                                    // vacant or not listed: leave it
                if (!samePerson(now.name, o.name)) {
                  changes.push({ id: o.id, name: now.name, party: now.party || '' });
                  log('New ' + seat + ' member, district ' + o.district_num + ': ' + now.name + ' (was ' + o.name + ')');
                  o.name = now.name; o.party = now.party; o.pinned_committee_ids = [];
                } else if (now.party && now.party !== o.party) {
                  changes.push({ id: o.id, name: o.name, party: now.party });
                }
              }
            }
            return changes;
          }

          // ── Michigan's files ────────────────────────────────────────────────────
          async function* zipRows(buf) {
            let eocd = -1;
            for (let i = buf.length - 22; i >= 0 && i > buf.length - 70000; i--) if (buf.readUInt32LE(i) === 0x06054b50) { eocd = i; break; }
            if (eocd < 0) throw new Error('That download isn\'t a zip file');
            const n = buf.readUInt16LE(eocd + 10);
            let p = buf.readUInt32LE(eocd + 16);
            const files = [];
            for (let i = 0; i < n; i++) {
              const method = buf.readUInt16LE(p + 10), csize = buf.readUInt32LE(p + 20), fl = buf.readUInt16LE(p + 28),
                el = buf.readUInt16LE(p + 30), cl = buf.readUInt16LE(p + 32), lho = buf.readUInt32LE(p + 42);
              files.push({ method, csize, lho, name: buf.toString('utf8', p + 46, p + 46 + fl) });
              p += 46 + fl + el + cl;
            }
            for (const f of files) {
              const fl = buf.readUInt16LE(f.lho + 26), el = buf.readUInt16LE(f.lho + 28);
              const start = f.lho + 30 + fl + el;
              let stream = Readable.from([buf.subarray(start, start + f.csize)]);
              if (f.method === 8) stream = stream.pipe(zlib.createInflateRaw());
              const dec = new StringDecoder('utf8');
              let carry = '', header = null;
              for await (const chunk of stream) {
                const parts = (carry + dec.write(chunk)).split('\n');
                carry = parts.pop();
                for (const ln of parts) {
                  const cols = ln.replace(/\r$/, '').split('\t');
                  if (!header) { header = cols; continue; }
                  const o = {};
                  for (let i = 0; i < header.length; i++) o[header[i]] = cols[i];
                  yield o;
                }
              }
              carry += dec.end();
              if (carry && header) { const cols = carry.split('\t'); const o = {}; for (let i = 0; i < header.length; i++) o[header[i]] = cols[i]; yield o; }
            }
          }
          function asOfFrom(raw) {
            // "Oct 29, 2026, 3:21:00 AM" (Michigan time) → "2026-10-29 03:21:00 America/Detroit"
            const m = String(raw || '').match(/([A-Za-z]{3}) (\d{1,2}), (\d{4}),? (\d{1,2}):(\d{2}):(\d{2}) ([AP]M)/);
            if (!m) return null;
            const mon = 'JanFebMarAprMayJunJulAugSepOctNovDec'.indexOf(m[1]) / 3 + 1;
            let hh = Number(m[4]) % 12 + (m[7] === 'PM' ? 12 : 0);
            const two = (x) => String(x).padStart(2, '0');
            return `${m[3]}-${two(mon)}-${two(m[2])} ${two(hh)}:${m[5]}:${m[6]} America/Detroit`;
          }

          async function main() {
            if (!KEY && !DRY) throw new Error('The TPV_JACKETS_KEY secret is missing. Add it under Settings → Secrets and variables → Actions.');
            const t0 = Date.now();
            const cycle = cycleNow(env.TODAY ? new Date(env.TODAY) : new Date());
            Object.assign(MI_CYCLE, cycle);
            log('Period:', cycle.label, `(${cycle.start} to ${cycle.end})`);

            const db = await siteKeys();
            const roster = await rpc(db, 'tpv_state_money_roster', {});
            if (!Array.isArray(roster) || !roster.length) throw new Error('No officials came back from the site. Has tpv_state_jackets.sql been run?');
            log('Officials:', roster.length);
            const changes = env.SKIP_ROSTER === '1' ? [] : await rosterChanges(roster);

            const listing = await (await get(MITN + 'page.request.do?page=gov.mi.boe.component.cfrexport.page.cfrexportresults&pageSize=40&pageNumber=1&sortDirection=DESC&sortBy=year&type=')).json();
            const list = (listing && listing.data && listing.data.list) || [];
            if (!list.length) throw new Error('Michigan\'s download list came back empty');
            const agg = miNewAgg();
            let asOf = null;
            for (const y of cycle.years) for (const [type, kind] of [['Contribution', 'contribution'], ['Receipts', 'receipt']]) {
              const f = list.find((x) => x.transactiontype === type && Number(x.year) === y);
              if (!f) { if (y <= cycle.years[1] && y <= new Date().getUTCFullYear()) log('⚠️  No ' + type + ' file for ' + y); continue; }
              const r = await get(MITN + 'page.request.do?page=gov.mi.boe.component.cfrexport.page.cfrexportfile&id=' + encodeURIComponent(f.download));
              const buf = Buffer.from(await r.arrayBuffer());
              let n = 0;
              for await (const o of zipRows(buf)) { n++; miAddRow(agg, o, kind); }
              log(`${type} ${y}: ${n.toLocaleString()} rows (${(buf.length / 1e6).toFixed(1)} MB, updated ${f.lastupdatedraw})`);
              if (type === 'Contribution' && n < 1000 && y <= new Date().getUTCFullYear()) throw new Error(type + ' ' + y + ' had only ' + n + ' rows; something is wrong with the download');
              const a = asOfFrom(f.lastupdatedraw);
              if (a && (!asOf || a > asOf)) asOf = a;
            }
            const coms = miFinish(agg);
            const shared = miSharedLastNames(roster);
            const rows = roster.map((o) => {
              const m = miMatch({ ...o, mi_committee_ids: o.pinned_committee_ids || [] }, coms);
              const row = miJacketRow(o, m, { sharedLast: shared.has(miNorm(miLastName(o.name))) });
              return { ...row, period_label: cycle.label };
            });
            const found = rows.filter((r) => r.mi_committee_ids.length).length;
            log(`Committees found for ${found} of ${rows.length} officials`);
            rows.filter((r) => !r.mi_committee_ids.length).forEach((r) => log('   no ' + cycle.label + ' committee money: ' + r.id + ' ' + roster.find((o) => o.id === r.id).name));

            let updated = 0;
            for (let i = 0; i < rows.length; i += 40) {
              const res = await rpc(db, 'tpv_state_money_load', { p_key: KEY || 'dry-run', p_rows: rows.slice(i, i + 40), p_as_of: asOf, p_roster: i === 0 && changes.length ? changes : null });
              updated += (res && res.updated) || 0;
            }
            log(`✓ Updated ${DRY ? rows.length + ' (dry run)' : updated} jackets in ${Math.round((Date.now() - t0) / 1000)} seconds. Michigan's files as of ${asOf}.`);
          }
          main().catch((e) => { console.error('✗ ' + (e && e.message || e)); process.exit(1); });
          TPV_SCRIPT
          node state-jackets.mjs
