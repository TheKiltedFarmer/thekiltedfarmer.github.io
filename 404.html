<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · The People's Voice</title>
  <script>
    // ── Selective SPA path router for GitHub Pages ──────────────────────────
    // GitHub Pages serves this file for any path it doesn't recognize.
    // We ONLY redirect to the People's Voice SPA when the path looks like
    // a county slug. Anything else (including unknown .html files, asset
    // paths, etc.) just shows a normal "page not found" message so other
    // apps living in this repo (like kilted_farmers_v5.html) aren't broken
    // by a greedy redirect.
    //
    // All 83 Michigan counties, plus a few hyphenated spellings (grand-traverse, st-clair...).
    // ────────────────────────────────────────────────────────────────────────
    (function(){
      var KNOWN_COUNTY_SLUGS = [
        'alcona', 'alger', 'allegan', 'alpena', 'antrim', 'arenac', 'baraga', 'barry',
        'bay', 'benzie', 'berrien', 'branch', 'calhoun', 'cass', 'charlevoix', 'cheboygan',
        'chippewa', 'clare', 'clinton', 'crawford', 'delta', 'dickinson', 'eaton', 'emmet',
        'genesee', 'gladwin', 'gogebic', 'grandtraverse', 'gratiot', 'hillsdale', 'houghton', 'huron',
        'ingham', 'ionia', 'iosco', 'iron', 'isabella', 'jackson', 'kalamazoo', 'kalkaska',
        'kent', 'keweenaw', 'lake', 'lapeer', 'leelanau', 'lenawee', 'livingston', 'luce',
        'mackinac', 'macomb', 'manistee', 'marquette', 'mason', 'mecosta', 'menominee', 'midland',
        'missaukee', 'monroe', 'montcalm', 'montmorency', 'muskegon', 'newaygo', 'oakland', 'oceana',
        'ogemaw', 'ontonagon', 'osceola', 'oscoda', 'otsego', 'ottawa', 'presqueisle', 'roscommon',
        'saginaw', 'sanilac', 'schoolcraft', 'shiawassee', 'stclair', 'stjoseph', 'tuscola', 'vanburen',
        'washtenaw', 'wayne', 'wexford', 'grand-traverse', 'st-clair', 'saint-clair', 'stclaire', 'st-joseph',
        'saint-joseph', 'van-buren', 'presque-isle'
      ];

      var loc = window.location;
      var path = loc.pathname || '/';
      var tail = loc.search + loc.hash;
      // Strip leading slash, take first segment, lowercase
      var firstSeg = path.replace(/^\/+/, '').split('/')[0].toLowerCase();

      if (KNOWN_COUNTY_SLUGS.indexOf(firstSeg) !== -1) {
        // Hand the real address to the app in the URL itself, so it still
        // works where browser storage is blocked (strict privacy settings,
        // some in-app email browsers). The #token from a password-reset or
        // confirm email rides along untouched.
        try { sessionStorage.setItem('tpv_original_path', path + tail); } catch (e) {}
        loc.replace('/?__route=' + encodeURIComponent(path + loc.search) + loc.hash);
        return;
      }

      // A password-reset, confirm or sign-in link that landed on an address we
      // don't recognize: never strand it on "page not found". Send it to the
      // app with its token, and the app takes it from there.
      if (/access_token|refresh_token|type=recovery|type=signup|type=invite|type=magiclink|type=email|token_hash|error_code|error_description|[?&#]code=|[?&]reset=1/.test(tail)) {
        loc.replace('/' + loc.search + loc.hash);
        return;
      }
      // Anything else (kilted_farmers_v5.html, unknown.html, /assets/x.png,
      // typos, etc.) falls through to the visible "page not found" UI below.
    })();
  </script>
  <style>
    body {
      margin: 0;
      background: #1a1a2e;
      color: #f0c040;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    h1 { font-family: 'Playfair Display', serif; font-size: 28px; margin: 0 0 8px; font-weight: 900; }
    p { color: #c8b890; margin: 6px 0; font-size: 14px; }
    a {
      color: #f0c040;
      text-decoration: none;
      border-bottom: 1px solid #f0c040;
      padding-bottom: 1px;
    }
    a:hover { color: #fff; border-bottom-color: #fff; }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      background: rgba(255,255,255,.06);
      padding: 6px 10px;
      border-radius: 4px;
      color: #aaa;
      margin-top: 14px;
      max-width: 80vw;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>The People's Voice</h1>
  <p>Page not found.</p>
  <p style="margin-top: 16px;">
    <a href="/">Return home</a>
  </p>
  <noscript>
    <p style="margin-top: 20px; font-size: 13px;">This site uses JavaScript. Please enable it in your browser.</p>
  </noscript>
</body>
</html>
